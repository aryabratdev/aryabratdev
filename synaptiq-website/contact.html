<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Synaptiq</title>
  <meta name="description" content="Contact Synaptiq to start a project or ask a question." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
</head>
<body data-page="contact">
  <header class="header">
    <div class="container nav">
      <a href="./index.html" class="brand" aria-label="Synaptiq home">
        <img src="./assets/logo.svg" alt="Synaptiq" class="logo" />
        <span class="name">Synaptiq</span>
      </a>
      <nav>
        <button class="nav-toggle" aria-expanded="false" aria-controls="primary-navigation" data-nav-toggle>
          <span aria-hidden="true">☰</span>
        </button>
        <div id="primary-navigation" class="nav-links">
          <a href="./index.html" data-page-link="home">Home</a>
          <a href="./about.html" data-page-link="about">About</a>
          <a href="./services.html" data-page-link="services">Services</a>
          <a href="./contact.html" class="btn btn-outline" data-page-link="contact">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="container hero">
      <span class="badge">Contact</span>
      <h1>Tell us about your project</h1>
      <p>We’ll get back to you within two business days.</p>
    </section>

    <section class="section">
      <div class="container">
        <form id="contact-form" class="form" action="mailto:hello@synaptiq.com" method="GET" enctype="text/plain">
          <div>
            <label for="name">Name</label>
            <input id="name" class="input" name="name" required placeholder="Your name" />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" class="input" type="email" name="email" required placeholder="you@company.com" />
          </div>
          <div>
            <label for="company">Company</label>
            <input id="company" class="input" name="company" placeholder="Company name (optional)" />
          </div>
          <div>
            <label for="message">How can we help?</label>
            <textarea id="message" class="input" name="message" rows="6" required placeholder="Brief project description"></textarea>
          </div>
          <div class="hero-cta">
            <button type="submit" class="btn btn-primary">Send</button>
            <span id="form-notice" class="text-muted" style="display:none"></span>
          </div>
          <p class="text-muted mt-3">Prefer email? Write us at <a href="mailto:hello@synaptiq.com">hello@synaptiq.com</a>.</p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="grid grid-2">
        <a href="./index.html" class="brand">
          <img src="./assets/logo.svg" alt="" class="logo" />
          <span class="name">Synaptiq</span>
        </a>
        <div class="meta" style="text-align:right;">
          <div>© <span id="year"></span> Synaptiq. All rights reserved.</div>
          <div><a href="./contact.html">hello@synaptiq.com</a></div>
        </div>
      </div>
    </div>
  </footer>

  <script src="./scripts/main.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
